# main에 올리면 Cloudflare Pages(astm-eng)로 배포한다.
# 시크릿: CLOUDFLARE_API_TOKEN (Pages 편집 권한), CLOUDFLARE_ACCOUNT_ID
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 올릴 파일만 모으기
        run: |
          mkdir dist
          git archive HEAD | tar -x -C dist
          rm -rf dist/.github dist/.gitignore dist/README.md dist/deploy.sh dist/docs
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=astm-eng --branch=main
